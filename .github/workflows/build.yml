name: Build

on:
  push:
    branches: [ main ]
  # No base branch filter, so stacked pull requests get built too.
  pull_request:

# A superseded run tells us nothing, so drop it and keep the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # verify, not test: the release builds the shaded jar, so package it here too.
      - run: mvn --batch-mode verify
